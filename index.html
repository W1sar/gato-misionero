<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gato Misionero</title>
<style>
:root{--bg:#f6f1ea;--text:#24201c;--red:#b83a22;--green:#1f8f55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f0d;--text:#f3ebe2;--red:#e2573a;--green:#3ddc84}}
:root[data-theme="dark"]{--bg:#120f0d;--text:#f3ebe2;--red:#e2573a;--green:#3ddc84}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none}
h1{margin:0;font-size:1.3rem;color:var(--green)}
#hud{display:flex;gap:18px;font-weight:700}
canvas{border:3px solid var(--green);border-radius:12px;background:linear-gradient(#1f8f55 0%,#14502f 70%,#b83a22 70%,#8e2a17 100%);max-width:100%;touch-action:none}
button{padding:10px 22px;border:0;border-radius:10px;background:var(--red);color:#fff;font:700 1rem inherit;cursor:pointer}
p{margin:0;font-size:.85rem;opacity:.8}
</style>
</head>
<body>
<h1>🐱 GATO MISIONERO</h1>
<div id="hud"><span>Puntos: <b id="s">0</b></span><span>Vidas: <b id="l">3</b></span><span>Récord: <b id="b">0</b></span></div>
<canvas id="c" width="360" height="460"></canvas>
<button id="go">Jugar</button>
<p>Atrapá 🧉 y 🐟. Esquivá 🪨. Mové con el dedo, mouse o flechas.</p>
<script>
var cv=document.getElementById("c"),x=cv.getContext("2d"),W=360,H=460;
var cat,items,score,lives,best=0,run=false,t=0,speed;
try{best=+localStorage.getItem("gm_best")||0}catch(e){}
document.getElementById("b").textContent=best;
function start(){cat=W/2;items=[];score=0;lives=3;t=0;speed=2;run=true;upd();document.getElementById("go").style.display="none";loop()}
function upd(){document.getElementById("s").textContent=score;document.getElementById("l").textContent=lives}
function move(px){var r=cv.getBoundingClientRect();cat=Math.max(24,Math.min(W-24,(px-r.left)*W/r.width))}
cv.addEventListener("pointermove",function(e){move(e.clientX)});
cv.addEventListener("pointerdown",function(e){move(e.clientX)});
addEventListener("keydown",function(e){if(e.key==="ArrowLeft")cat=Math.max(24,cat-28);if(e.key==="ArrowRight")cat=Math.min(W-24,cat+28)});
function loop(){
 if(!run)return;
 t++;
 if(t%Math.max(18,50-Math.floor(score/3))===0){var r=Math.random();items.push({x:20+Math.random()*(W-40),y:-20,e:r<.3?"🪨":(r<.65?"🧉":"🐟"),bad:r<.3})}
 x.clearRect(0,0,W,H);x.textAlign="center";x.font="32px serif";
 for(var i=items.length-1;i>=0;i--){var it=items[i];it.y+=speed+score*0.02;x.fillText(it.e,it.x,it.y);
  if(it.y>H-60&&it.y<H-20&&Math.abs(it.x-cat)<32){
   if(it.bad){lives--;}else{score++;speed=Math.min(6,2+score*0.05)}
   items.splice(i,1);upd();
  }else if(it.y>H+20){items.splice(i,1)}}
 x.font="40px serif";x.fillText("🐱",cat,H-24);
 if(lives<=0){end();return}
 requestAnimationFrame(loop)
}
function end(){run=false;if(score>best){best=score;document.getElementById("b").textContent=best;try{localStorage.setItem("gm_best",best)}catch(e){}}
 x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.font="bold 28px Courier New";x.fillText("GAME OVER",W/2,H/2-10);x.font="18px Courier New";x.fillText("Puntos: "+score,W/2,H/2+20);
 var b=document.getElementById("go");b.textContent="Jugar de nuevo";b.style.display="block"}
document.getElementById("go").addEventListener("click",start);
x.textAlign="center";x.font="60px serif";x.fillText("🐱",W/2,H/2);
</script>
</body>
</html>
